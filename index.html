<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AR.js con A-Frame - Modelo 3D de Cerebro</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- AR.js (versión estable 2.2.1) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@2.2.1/aframe/build/aframe-ar.min.js"></script>

  <style>
    body, html {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: black;
    }
  </style>
</head>
<body>

  <!-- Verifica que la cámara se inicie -->
  <script>
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(function(stream) {
        console.log("✅ Cámara activada correctamente.");
      })
      .catch(function(err) {
        console.error("🚨 Error activando la cámara:", err);
        alert("Error: Permite el acceso a la cámara en tu navegador.");
      });
  </script>

  <!-- Escena de A-Frame con AR.js -->
  <a-scene
    vr-mode-ui="enabled: false;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: true;"
  >

    <!-- Patrón HIRO desde GitHub RAW -->
    <a-marker
      type="pattern"
      url="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/data/patt.hiro"
    >

      <!-- Modelo 3D cargado desde GitHub Pages -->
      <a-entity 
        gltf-model="https://francym1010.github.io/model/model_of_a_human_brain.glb"
        position="0 0 0"
        scale="0.1 0.1 0.1"
        rotation="0 180 0">
      </a-entity>

    </a-marker>

    <!-- Cámara AR -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
