<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AR.js con A-Frame - Modelo 3D de Cerebro</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- AR.js versión 2.2.1 (más estable) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@2.2.1/aframe/build/aframe-ar.min.js"></script>

  <style>
    body, html {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: black;
      text-align: center;
    }
    #restart-btn {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      color: black;
      border: none;
      padding: 10px;
      cursor: pointer;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- Botón para reiniciar la cámara si está en negro -->
  <button id="restart-btn" onclick="restartCamera()">🔄 Reiniciar Cámara</button>

  <!-- Verifica que la cámara se inicie correctamente -->
  <script>
    function checkCamera() {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(function(stream) {
          console.log("✅ Cámara activada correctamente.");
        })
        .catch(function(err) {
          console.error("🚨 Error activando la cámara:", err);
          alert("❌ No se pudo acceder a la cámara. Habilítala en la configuración del navegador.");
        });
    }

    function restartCamera() {
      location.reload();
    }

    document.addEventListener("DOMContentLoaded", checkCamera);
  </script>

  <!-- Escena de A-Frame con AR.js -->
  <a-scene
    vr-mode-ui="enabled: false;"
    embedded
    arjs="trackingMethod: area; sourceType: webcam; debugUIEnabled: true; videoTexture: true;"
  >

    <!-- Patrón HIRO desde tu propio GitHub Pages -->
    <a-marker
      type="pattern"
      url="https://francym1010.github.io/pattern/patt.hiro"
    >

      <!-- Modelo 3D sin DRACO para prueba -->
      <a-entity 
        gltf-model="https://francym1010.github.io/model/model_of_a_human_brain.glb"
        position="0 0 0"
        scale="0.1 0.1 0.1"
        rotation="0 180 0"
      >
      </a-entity>

    </a-marker>

    <!-- Cámara AR con controles -->
    <a-entity camera position="0 1.6 0"></a-entity>

  </a-scene>

</body>
</html>
