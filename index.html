<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AR.js - Prueba de Patrón</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- AR.js (versión estable 2.2.1) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@2.2.1/aframe/build/aframe-ar.min.js"></script>

  <style>
    body, html {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: black;
      text-align: center;
    }
  </style>
</head>
<body>

  <a-scene
    vr-mode-ui="enabled: false;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: true;"
  >

    <!-- Prueba con patrón HIRO en caso de que el otro falle -->
    <a-marker type="pattern" url="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/data/patt.hiro" emitevent>
      
      <!-- Log de detección en consola -->
      <script>
        document.addEventListener("DOMContentLoaded", function() {
          let marker = document.querySelector('a-marker');
          if (marker) {
            marker.addEventListener('markerFound', function() {
              console.log("🎯 Patrón detectado correctamente.");
            });
            marker.addEventListener('markerLost', function() {
              console.log("❌ Patrón perdido.");
            });
          } else {
            console.error("⚠ No se encontró el marcador en el DOM.");
          }
        });
      </script>

      <!-- Caja de prueba -->
      <a-box position="0 1 0" material="color: red; opacity: 0.8;"></a-box>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
