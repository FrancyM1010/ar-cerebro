<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AR.js - Prueba de Acceso a la Cámara</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- AR.js (versión estable 2.2.1) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@2.2.1/aframe/build/aframe-ar.min.js"></script>

  <style>
    body, html {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: black;
      text-align: center;
    }
    #start-btn {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      color: black;
      border: none;
      padding: 10px;
      cursor: pointer;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <!-- Botón para solicitar acceso a la cámara -->
  <button id="start-btn" onclick="startAR()">🎥 Activar Cámara</button>

  <script>
    function startAR() {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(function(stream) {
          console.log("✅ Cámara activada correctamente.");
          document.getElementById("start-btn").style.display = "none"; // Oculta el botón
          document.getElementById("ar-scene").style.display = "block"; // Muestra la escena AR
        })
        .catch(function(err) {
          console.error("🚨 Error activando la cámara:", err);
          alert("❌ No se pudo acceder a la cámara. Habilítala en la configuración del navegador.");
        });
    }
  </script>

  <!-- Escena de A-Frame con AR.js -->
  <a-scene
    id="ar-scene"
    vr-mode-ui="enabled: false;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: true;"
    style="display: none;" <!-- Oculta la escena hasta que la cámara esté activa -->
  >

    <!-- Patrón HIRO -->
    <a-marker type="pattern" url="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/data/patt.hiro">
      
      <!-- Caja de prueba -->
      <a-box position="0 1 0" material="color: red; opacity: 0.8;"></a-box>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
