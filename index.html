<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AR.js con A-Frame - Modelo 3D de Cerebro</title>

  <!-- A-Frame (framework para 3D en la web) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- AR.js versión más estable (2.2.1 en vez de 3.3.2) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@2.2.1/aframe/build/aframe-ar.min.js"></script>

  <style>
    body, html {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
  </style>
</head>
<body>

  <!-- Escena de A-Frame con AR.js -->
  <a-scene
    vr-mode-ui="enabled: false;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: true;"
  >

    <!-- Marcador HIRO -->
    <a-marker
      type="pattern"
      url="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/data/patt.hiro"
    >

      <!-- Modelo 3D desde Google Drive (Formato de descarga directa) -->
      <a-entity 
        gltf-model="https://drive.google.com/uc?export=download&id=1y9a82jwkHcBsU1fWRZMBAqHVlFob6pTH"
        position="0 0 0"
        scale="0.05 0.05 0.05"
        rotation="0 180 0">
      </a-entity>

    </a-marker>

    <!-- Cámara AR -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
