<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AR.js con A-Frame - Modelo 3D de Cerebro</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- AR.js (versión estable 2.2.1) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@2.2.1/aframe/build/aframe-ar.min.js"></script>

  <style>
    body, html {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: black;
      text-align: center;
    }
    #restart-btn {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      color: black;
      border: none;
      padding: 10px;
      cursor: pointer;
      z-index: 1000;
    }
    #video-preview {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 320px;
      height: 240px;
      background: gray;
    }
  </style>
</head>
<body>

  <!-- Botón para reiniciar la cámara -->
  <button id="restart-btn" onclick="restartCamera()">🔄 Reiniciar Cámara</button>

  <!-- Vista previa de la cámara para depuración -->
  <video id="video-preview" autoplay playsinline></video>

  <!-- Script para forzar la cámara -->
  <script>
    function checkCamera() {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
        .then(function(stream) {
          console.log("✅ Cámara activada correctamente.");
          document.getElementById("video-preview").srcObject = stream; // Mostrar la cámara
        })
        .catch(function(err) {
          console.error("🚨 Error activando la cámara:", err);
          alert("❌ No se pudo acceder a la cámara. Habilítala en la configuración del navegador.");
        });
    }

    function restartCamera() {
      location.reload();
    }

    document.addEventListener("DOMContentLoaded", checkCamera);
  </script>

  <!-- Escena de A-Frame con AR.js -->
  <a-scene
    vr-mode-ui="enabled: false;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: true; videoTexture: true;"
  >

    <!-- Patrón HIRO cargado desde GitHub RAW -->
    <a-marker
      type="pattern"
      url="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/data/patt.hiro"
    >

      <!-- Modelo de prueba (si el otro no carga) -->
      <a-box position="0 0.5 0" material="color: red;"></a-box>

    </a-marker>

    <!-- Cámara AR -->
    <a-entity camera position="0 1.6 0"></a-entity>

  </a-scene>

</body>
</html>
