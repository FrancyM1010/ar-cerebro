<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AR.js con A-Frame - Solución Final</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- AR.js (versión estable 3.3.2) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/aframe/build/aframe-ar.min.js"></script>

  <style>
    body, html {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: black;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Escena de A-Frame con AR.js -->
  <a-scene
    vr-mode-ui="enabled: false;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: true;"
  >

    <!-- Patrón personalizado en GitHub Pages -->
    <a-marker type="pattern" url="https://francym1010.github.io/ar-cerebro/marcador.patt" emitevent>
      
      <!-- Log para verificar detección -->
      <script>
        document.querySelector('a-marker').addEventListener('markerFound', function() {
          console.log("🎯 Patrón detectado correctamente.");
        });
        document.querySelector('a-marker').addEventListener('markerLost', function() {
          console.log("❌ Patrón perdido.");
        });
      </script>

      <!-- Caja de prueba más grande -->
      <a-box position="0 1 0" material="color: yellow; opacity: 0.9;"></a-box>

    </a-marker>

    <!-- Cámara AR -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
