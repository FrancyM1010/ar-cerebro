<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AR.js con A-Frame - Prueba con otro patrón</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

  <!-- AR.js (versión estable 2.2.1) -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@2.2.1/aframe/build/aframe-ar.min.js"></script>

  <style>
    body, html {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
      background: black;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Escena de A-Frame con AR.js -->
  <a-scene
    vr-mode-ui="enabled: false;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: true;"
  >

    <!-- Prueba con otro patrón (kanji.patt) -->
    <a-marker
      type="pattern"
      url="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/data/patt.kanji"
      emitevent
    >
      <!-- Log para detectar si AR.js reconoce el patrón -->
      <script>
        document.querySelector('a-marker').addEventListener('markerFound', function() {
          console.log("🎯 Patrón KANJI detectado correctamente.");
        });
        document.querySelector('a-marker').addEventListener('markerLost', function() {
          console.log("❌ Patrón KANJI perdido.");
        });
      </script>

      <!-- Modelo de prueba -->
      <a-box position="0 1 0" material="color: blue; opacity: 0.8;"></a-box>

    </a-marker>

    <!-- Cámara AR -->
    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
