<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>AR.js con A-Frame - Modelo 3D de Cerebro</title>
  <!-- A-Frame (framework para 3D en la web) -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <!-- AR.js versión para A-Frame -->
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.3.2/aframe/build/aframe-ar.js"></script>
  <style>
    body, html {
      margin: 0;
      overflow: hidden;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <!-- Escena de A-Frame con AR.js -->
  <a-scene
    vr-mode-ui="enabled: false;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <!-- Marcador (en este caso HIRO) -->
    <a-marker
      type="pattern"
      url="hiro.patt"
    >
      <!-- Aquí insertas tu modelo 3D -->
      <a-entity 
        gltf-model="https://raw.githubusercontent.com/FrancyM1010/ar-cerebro/main/models/model_of_a_human_brain.glb"
        position="0 0 0"
        scale="0.05 0.05 0.05"
        rotation="0 180 0">
      </a-entity>

    </a-marker>

    <!-- Cámara AR -->
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
